# TCM-integrated Stage1+2 — aligned to final_features_used (2026-07 best runs).

stage1:
  ALT:
    input_type: continuous
    label_zh: "丙氨酸氨基转移酶（ALT, U/L）"
    label_en: "Alanine aminotransferase (ALT, U/L)"
    scoring_zh: "实验室丙氨酸氨基转移酶。"
    scoring_en: "Serum alanine aminotransferase."
  Alb:
    input_type: continuous
    label_zh: "白蛋白（Alb, g/L）"
    label_en: "Albumin (Alb, g/L)"
    scoring_zh: "血清白蛋白浓度。"
    scoring_en: "Serum albumin concentration."
  BianXue:
    input_type: ordinal
    label_zh: "便血程度"
    label_en: "Stool blood severity"
    scoring_zh: "1=粪便隐血试验阴性；2=粪便隐血试验阳性但肉眼不可见血便；3=肉眼可见鲜血/暗红血(附表)；4=肉眼可见鲜血/暗红血(混合)；5=大量血便/柏油样便。"
    scoring_en: "1=Fecal occult blood test negative; 2=FOBT positive without visible blood; 3=Visible blood (separate); 4=Visible blood (mixed); 5=Massive hematochezia/melena."
    options:
      - { value: 1, short_zh: "1 — 粪便隐血试验阴性", short_en: "1 — FOBT negative" }
      - { value: 2, short_zh: "2 — 隐血阳性，肉眼不可见血便", short_en: "2 — FOBT positive, no visible blood" }
      - { value: 3, short_zh: "3 — 肉眼可见血便(附表)", short_en: "3 — Visible blood (separate)" }
      - { value: 4, short_zh: "4 — 肉眼可见血便(混合)", short_en: "4 — Visible blood (mixed)" }
      - { value: 5, short_zh: "5 — 大量血便/柏油样便", short_en: "5 — Massive blood / melena" }
  BianZhi:
    input_type: ordinal
    label_zh: "便质"
    label_en: "Stool consistency"
    scoring_zh: "1=干硬；2=成形；3=软便；4=糊状便；5=稀水便。"
    scoring_en: "1=Hard; 2=Formed; 3=Soft; 4=Paste; 5=Watery."
    options:
      - { value: 1, short_zh: "1 — 干硬", short_en: "1 — Hard" }
      - { value: 2, short_zh: "2 — 成形", short_en: "2 — Formed" }
      - { value: 3, short_zh: "3 — 软便", short_en: "3 — Soft" }
      - { value: 4, short_zh: "4 — 糊状便", short_en: "4 — Paste" }
      - { value: 5, short_zh: "5 — 稀水便", short_en: "5 — Watery" }
  Fe:
    input_type: continuous
    label_zh: "血清铁（Fe, μmol/L）"
    label_en: "Serum iron (Fe, μmol/L)"
    scoring_zh: "血清铁浓度。"
    scoring_en: "Serum iron concentration."
  K:
    input_type: continuous
    label_zh: "钾（K, mmol/L）"
    label_en: "Potassium (K, mmol/L)"
    scoring_zh: "血清钾离子浓度。"
    scoring_en: "Serum potassium concentration."
  NianYe:
    input_type: ordinal
    label_zh: "粪便粘液可见度"
    label_en: "Visible stool mucus"
    scoring_zh: "1=无粘液；2=少量粘液附着；3=大量粘液附着或混合。"
    scoring_en: "1=No mucus; 2=Small amount; 3=Large amount or mixed."
    options:
      - { value: 1, short_zh: "1 — 无粘液", short_en: "1 — No mucus" }
      - { value: 2, short_zh: "2 — 少量粘液", short_en: "2 — Small amount" }
      - { value: 3, short_zh: "3 — 大量粘液/混合", short_en: "3 — Large amount / mixed" }
  PaiBianKunn:
    input_type: binary
    label_zh: "排便困难"
    label_en: "Difficult defecation"
    scoring_zh: "0=无；1=有。"
    scoring_en: "0=Absent; 1=Present."
    options:
      - { value: 0, short_zh: "0 — 无", short_en: "0 — Absent" }
      - { value: 1, short_zh: "1 — 有", short_en: "1 — Present" }
  TCM_Nature_mix:
    input_type: binary
    label_zh: "TCM_Nature_mix"
    label_en: "TCM_Nature_mix — Mixed excess-deficiency pattern"
    scoring_zh: "病性虚实夹杂；0=否，1=是（规则化编码）。"
    scoring_en: "Mixed excess-deficiency pattern; 0=Absent, 1=Present (rule-based encoding)."
    options:
      - { value: 0, short_zh: "0 — 否", short_en: "0 — Absent" }
      - { value: 1, short_zh: "1 — 是", short_en: "1 — Present" }
  TCM_Syn_damp_heat:
    input_type: binary
    label_zh: "TCM_Syn_damp_heat"
    label_en: "TCM_Syn_damp_heat — Damp-heat syndrome"
    scoring_zh: "湿热内蕴/湿热证；0=否，1=是（规则化编码）。"
    scoring_en: "Damp-heat syndrome; 0=Absent, 1=Present (rule-based encoding)."
    options:
      - { value: 0, short_zh: "0 — 否", short_en: "0 — Absent" }
      - { value: 1, short_zh: "1 — 是", short_en: "1 — Present" }
  TCM_Syn_qi_blood_def:
    input_type: binary
    label_zh: "TCM_Syn_qi_blood_def"
    label_en: "TCM_Syn_qi_blood_def — Qi and blood deficiency syndrome"
    scoring_zh: "气血不足/气血两虚；0=否，1=是（规则化编码）。"
    scoring_en: "Qi and blood deficiency syndrome; 0=Absent, 1=Present (rule-based encoding)."
    options:
      - { value: 0, short_zh: "0 — 否", short_en: "0 — Absent" }
      - { value: 1, short_zh: "1 — 是", short_en: "1 — Present" }
  TCM_Syn_qi_stagnation_blood_stasis:
    input_type: binary
    label_zh: "TCM_Syn_qi_stagnation_blood_stasis"
    label_en: "TCM_Syn_qi_stagnation_blood_stasis — Qi stagnation and blood stasis syndrome"
    scoring_zh: "气滞血瘀/肝气郁结；0=否，1=是（规则化编码）。"
    scoring_en: "Qi stagnation and blood stasis syndrome; 0=Absent, 1=Present (rule-based encoding)."
    options:
      - { value: 0, short_zh: "0 — 否", short_en: "0 — Absent" }
      - { value: 1, short_zh: "1 — 是", short_en: "1 — Present" }
  TCM_Syn_spleen_kidney_yang:
    input_type: binary
    label_zh: "TCM_Syn_spleen_kidney_yang"
    label_en: "TCM_Syn_spleen_kidney_yang — Spleen-kidney yang deficiency syndrome"
    scoring_zh: "脾肾阳虚（阳虚）；0=否，1=是（规则化编码）。"
    scoring_en: "Spleen-kidney yang deficiency syndrome; 0=Absent, 1=Present (rule-based encoding)."
    options:
      - { value: 0, short_zh: "0 — 否", short_en: "0 — Absent" }
      - { value: 1, short_zh: "1 — 是", short_en: "1 — Present" }
  Age:
    input_type: continuous
    label_zh: "年龄（岁）"
    label_en: "Age (years)"
    scoring_zh: "患者年龄（岁）。"
    scoring_en: "Patient age in years."
    min_value: 1
  TP:
    input_type: continuous
    label_zh: "总蛋白（TP, g/L）"
    label_en: "Total protein (TP, g/L)"
    scoring_zh: "血清总蛋白。"
    scoring_en: "Serum total protein."

stage2:
  Age:
    input_type: continuous
    label_zh: "年龄（岁）"
    label_en: "Age (years)"
    scoring_zh: "患者年龄（岁）。"
    scoring_en: "Patient age in years."
    min_value: 1
  CRP:
    input_type: continuous
    label_zh: "C-反应蛋白（CRP, mg/L）"
    label_en: "C-reactive protein (CRP, mg/L)"
    scoring_zh: "血清 C-反应蛋白。"
    scoring_en: "Serum C-reactive protein."
  FC:
    input_type: continuous
    label_zh: "粪钙卫蛋白（FC, μg/g）"
    label_en: "Fecal calprotectin (FC, μg/g)"
    scoring_zh: "粪便钙卫蛋白浓度。"
    scoring_en: "Fecal calprotectin concentration."
  LinBaJiShu:
    input_type: continuous
    label_zh: "淋巴细胞绝对值（×10⁹/L）"
    label_en: "Lymphocyte absolute count (×10⁹/L)"
    scoring_zh: "外周血淋巴细胞绝对计数。"
    scoring_en: "Peripheral blood lymphocyte absolute count."
  NianYe:
    input_type: ordinal
    label_zh: "粪便粘液可见度"
