stage1_skip_note:
  zh: "若基本确定已排除感染性肠炎和功能性腹泻/IBS，可直接跳转至 Stage 2 标签页进行 UC 定向鉴别。"
  en: "If infectious enteritis and functional diarrhea/IBS have been reasonably excluded, proceed to Stage 2 for UC-specific discrimination."

variable_reference_footer:
  zh: "中医特征为病历文本规则化编码，非床旁四诊实时采集。详细编码见论文附件。"
  en: "TCM features are rule-based encodings from clinical records, not real-time four-examination data."

disclaimer:
  en: >
    Research-only inference prototype for academic demonstration and peer review.
    TCM Integrated Model combines baseline clinical/laboratory predictors with
    rule-based TCM encodings. Endoscopy and histopathology retain priority.
    Not for commercial or standalone clinical use. User inputs are not stored.
    Stage 1 and Stage 2 were externally validated separately (W2); not a probability cascade.
  zh: >
    仅供科研演示与同行评议。中西医融合模型（TCM Integrated Model）在基线临床/实验室指标上
    融合病历规则化中医编码；内镜与病理仍具优先地位。不得用于商业或独立临床诊断。
    用户输入不作存储。Stage 1 与 Stage 2 分段外验（W2），非概率级联。
